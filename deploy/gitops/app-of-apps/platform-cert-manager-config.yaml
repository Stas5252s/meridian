apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: meridian
  source:
    repoURL: https://github.com/Stas5252s/meridian.git
    targetRevision: main
    path: deploy/platform/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
