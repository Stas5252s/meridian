apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meridian
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Meridian platform components and workloads.
  sourceRepos:
    - https://github.com/Stas5252s/meridian.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: checkout-local
    - server: https://kubernetes.default.svc
      namespace: checkout-staging
    - server: https://kubernetes.default.svc
      namespace: checkout-prod
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: read-only
      description: Read-only access to Meridian applications, logs, and events.
      policies:
        - p, proj:meridian:read-only, applications, get, meridian/*, allow
        - p, proj:meridian:read-only, logs, get, meridian/*, allow
      groups:
        - meridian:read-only
