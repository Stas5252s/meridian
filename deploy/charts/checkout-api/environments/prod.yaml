# Production is manual-sync in ArgoCD: a human reviews the diff and promotes the
# exact digest/tag validated in staging.
replicaCount: 3

image:
  repository: ghcr.io/Stas5252s/meridian/checkout-api
  tag: v0.1.0

ingress:
  enabled: true
  host: checkout-prod.localtest.me
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  tls:
    enabled: true
    secretName: checkout-prod-tls

rollout:
  enabled: true
  analysis:
    enabled: true
    successRateThreshold: 0.995

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/instance: checkout-api-prod
