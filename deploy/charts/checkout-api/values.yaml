# Default values are production-shaped: hardened security context, probes, PDB,
# network policy, and observability are on by default. Environment overlays in
# environments/ override the pieces that differ.

replicaCount: 2

image:
  repository: ghcr.io/Stas5252s/meridian/checkout-api
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

containerPort: 8080

terminationGracePeriodSeconds: 30

redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: "7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf"
    pullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  persistence:
    # Demo default: the datastore survives app pod churn, not node loss. Set a
    # PVC-backed volume for real durability.
    emptyDirSizeLimit: 256Mi

config:
  logLevel: info
  shutdownTimeout: 15s
  idempotencyTTL: 24h
  maxBodyBytes: 1048576
  faultLatencyMs: 0

extraEnv: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: checkout.localtest.me
  path: /
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

rollout:
  enabled: false
  trafficRouting:
    nginx:
      enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
    successRateThreshold: 0.99
    latencyThresholdSeconds: 0.3
  # steps: [] # optional full override of the canary steps

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  defaultDeny: true
  ingressNamespaceSelectors:
    - kubernetes.io/metadata.name: ingress-nginx
    - kubernetes.io/metadata.name: monitoring
  dnsNamespace: kube-system
  dnsPort: 53

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack

prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack
  slo:
    availabilityTarget: 0.995
    latencyTargetSeconds: 0.3

dashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"
    grafana_folder: Meridian

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
