name: codeql

on:
  push:
    branches: [main]
    paths:
      - "services/checkout-api/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "services/checkout-api/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze Go
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: go
          queries: security-extended
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/checkout-api/go.mod
          cache-dependency-path: services/checkout-api/go.sum
      - name: build
        working-directory: services/checkout-api
        run: CGO_ENABLED=0 go build ./...
      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:go
