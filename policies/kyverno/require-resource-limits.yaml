apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: meridian-require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory requests and limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Requests drive scheduling and the HPA; limits protect node stability.
      Containers without both make capacity planning and SLO ownership
      impossible.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: meridian-namespace
      expression: >-
        object.metadata.namespace in
        ['checkout-local', 'checkout-staging', 'checkout-prod']
  variables:
    - name: containers
      expression: object.spec.containers
  validations:
    - expression: >-
        variables.containers.all(c,
        has(c.resources) && has(c.resources.requests) &&
        has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
        has(c.resources.limits) && has(c.resources.limits.cpu) &&
        has(c.resources.limits.memory))
      message: "Each container must set CPU and memory requests and limits."
