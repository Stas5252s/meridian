apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: meridian-restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict production image registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Production pods may only pull from the Meridian GHCR namespace. This
      keeps the blast radius of a compromised upstream registry or typo'd
      image reference out of production.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: meridian-prod-namespace
      expression: object.metadata.namespace == 'checkout-prod'
    - name: meridian-not-datastore
      expression: >-
        !(has(object.metadata.labels) &&
          'app.kubernetes.io/component' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/component'] == 'redis')
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.startsWith('ghcr.io/your-org/meridian/'))
      message: "Production images must come from ghcr.io/your-org/meridian/."
