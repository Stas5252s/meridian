apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: meridian-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow mutable image tags
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Mutable tags make rollbacks and provenance ambiguous. Every container
      must reference an explicit tag or digest; ':latest' and untagged images
      are rejected.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: meridian-namespace
      expression: >-
        object.metadata.namespace in
        ['checkout-local', 'checkout-staging', 'checkout-prod']
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
        c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') ||
        c.image.contains('@'))
      message: "Images must use an explicit tag or digest; untagged images are not allowed."
    - expression: >-
        variables.containers.all(c, !c.image.endsWith(':latest'))
      message: "The mutable ':latest' tag is not allowed."
