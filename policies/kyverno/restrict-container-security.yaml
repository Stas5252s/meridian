apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: meridian-restrict-container-security
  annotations:
    policies.kyverno.io/title: Restrict container security context
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Containers must run unprivileged, without privilege escalation, with a
      read-only root filesystem and all Linux capabilities dropped. This
      complements the restricted Pod Security Standard with explicit,
      reportable intent.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: meridian-namespace
      expression: >-
        object.metadata.namespace in
        ['checkout-local', 'checkout-staging', 'checkout-prod']
  variables:
    - name: containers
      expression: object.spec.containers
  validations:
    - expression: >-
        variables.containers.all(c,
        has(c.securityContext) &&
        has(c.securityContext.privileged) && c.securityContext.privileged == false &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false &&
        has(c.securityContext.readOnlyRootFilesystem) &&
        c.securityContext.readOnlyRootFilesystem == true &&
        has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop)
      message: >-
        Containers must set privileged=false, allowPrivilegeEscalation=false,
        readOnlyRootFilesystem=true and drop ALL capabilities.
