apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: meridian-require-signed-images
  annotations:
    policies.kyverno.io/title: Require cosign-signed images with SBOM attestation
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Production workloads must run images signed keyless by the Meridian
      release workflow, with a Rekor transparency log entry and an attached
      SPDX SBOM attestation. Images are pinned to the verified digest before
      admission. Any registry/webhook failure fails closed.
spec:
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: meridian-prod-namespace
      expression: object.metadata.namespace == 'checkout-prod'
    - name: meridian-not-datastore
      expression: >-
        !(has(object.metadata.labels) &&
          'app.kubernetes.io/component' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/component'] == 'redis')
  matchImageReferences:
    - glob: "ghcr.io/your-org/meridian/checkout-api:*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: false
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/your-org/meridian/.github/workflows/release.yml@refs/tags/*
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document
  variables:
    - name: allImages
      expression: >-
        images.?containers.orValue([]) + images.?initContainers.orValue([]) +
        images.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allImages.map(image, verifyImageSignatures(image, [attestors.github])).all(count, count > 0)
      message: "Images must be signed by the Meridian release workflow via GitHub Actions keyless OIDC."
    - expression: >-
        variables.allImages.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.github])).all(count, count > 0)
      message: "Images must carry a cosign-verified SPDX SBOM attestation from the Meridian release workflow."
