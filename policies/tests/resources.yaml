# Test fixtures for the Meridian Kyverno policy suite. Every Pod carries the
# full hardening contract so that a failure isolates a single policy.
apiVersion: v1
kind: Namespace
metadata:
  name: checkout-local
  labels:
    meridian.io/environment: local
---
apiVersion: v1
kind: Namespace
metadata:
  name: checkout-staging
  labels:
    meridian.io/environment: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: checkout-prod
  labels:
    meridian.io/environment: prod
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: checkout-staging
  labels:
    app: checkout-api
spec:
  containers:
    - name: api
      image: ghcr.io/your-org/meridian/checkout-api:1.4.2
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-pod
  namespace: checkout-staging
spec:
  containers:
    - name: api
      image: nginx:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: untagged-pod
  namespace: checkout-local
spec:
  containers:
    - name: api
      image: ghcr.io/your-org/meridian/checkout-api
---
apiVersion: v1
kind: Pod
metadata:
  name: good-prod-pod
  namespace: checkout-prod
spec:
  containers:
    - name: api
      image: ghcr.io/your-org/meridian/checkout-api:1.4.2
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-registry-pod
  namespace: checkout-prod
spec:
  containers:
    - name: api
      image: docker.io/library/nginx:1.27
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: checkout-staging
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: meridian
    meridian.io/team: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/meridian/checkout-api:1.4.2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment
  namespace: checkout-prod
  labels:
    app.kubernetes.io/name: checkout-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/meridian/checkout-api:1.4.2
